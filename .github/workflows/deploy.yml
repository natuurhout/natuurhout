name: Deploy

# Every push to main builds the site and deploys the Worker to Cloudflare, so a
# content change only needs a push. Build failures (TypeScript, Next.js) stop
# the deploy and show up as a red cross on the commit.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLAUDE_CLOUDFLARE     "Edit Cloudflare Workers" API token on the FX Media account
#   CLOUDFLARE_ACCOUNT_ID the Cloudflare account id

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLAUDE_CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Live check
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 30 https://natuurhout.tiny-fire-1523.workers.dev/)
          echo "HTTP $code"; [ "$code" = "200" ]
