name: Deploy

# Every push to main builds the site and deploys the Worker to Cloudflare, so a
# content change only needs a push. Build failures (TypeScript, Next.js) stop
# the deploy and show up as a red cross on the commit.
#
# Catalogue edits made in the backend (beheer.natuurhout.be → Producten /
# Voorraad, published at /api/catalogus/) are copied into
# src/data/catalog-overrides.json first (committed, so the repo has the
# history of every price change). The Worker starts this workflow itself
# (workflow_dispatch, secret GITHUB_DEPLOY_TOKEN on the Worker) as soon as the
# backend differs from the live site, and its 5-minute Cloudflare cron retries
# a run that failed (worker/shop/publish.ts). The schedule below is only a
# backup: GitHub often delays or skips it. Pull before you push: this job commits too.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLAUDE_CLOUDFLARE     "Edit Cloudflare Workers" API token on the FX Media account
#   CLOUDFLARE_ACCOUNT_ID the Cloudflare account id

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Catalogue edits from the backend
        id: sync
        run: node scripts/sync-catalog.mjs
      - name: Commit catalogue edits
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "natuurhout-beheer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog-overrides.json
          git commit -m "Catalogus: wijzigingen uit beheer.natuurhout.be"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Install
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: npm ci
      - name: Typecheck
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: npm run typecheck
      - name: Deploy
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLAUDE_CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Live check
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 30 https://www.natuurhout.be/)
          echo "HTTP $code"; [ "$code" = "200" ]
