name: Supabase keep-alive

# Free Supabase projects pause after 7 days without database activity. This
# runs a real query in each project twice a day — so several skipped or
# delayed GitHub cron runs in a row still leave days of margin — and restores
# a project that paused anyway. Every failure opens (or refreshes) one issue
# titled "Supabase keep-alive is failing", which closes itself on recovery.
#
# Setup (Settings → Secrets and variables → Actions):
#   secret   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens (choose "never expires")
#   variable SUPABASE_PROJECT_REFS  the project ref(s), comma separated — the id in
#                                   supabase.com/dashboard/project/<ref>; the project
#                                   URL https://<ref>.supabase.co works too

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

env:
  ALERT_TITLE: Supabase keep-alive is failing

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/supabase-keepalive.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Query each project (restore if paused)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REFS: ${{ vars.SUPABASE_PROJECT_REFS || secrets.SUPABASE_PROJECT_REFS }}
        run: |
          set -o pipefail
          node scripts/supabase-keepalive.mjs 2>&1 | tee "$RUNNER_TEMP/report.txt"

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repository activity — the classic way a keep-alive dies
      # unnoticed. Re-enabling through the API each run keeps it switched on.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/supabase-keepalive.yml/enable"

      # One issue per outage: opening it notifies you once; later failing runs
      # only refresh its body, so a long outage does not flood your inbox.
      - name: Raise the alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/report.txt"
          [ -s "$report" ] || echo "No output — the job failed before the keep-alive ran. Open the run for details." > "$report"
          {
            echo "The scheduled Supabase keep-alive failed at $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo '```'
            cat "$report"
            echo '```'
            echo
            echo "Run: $RUN_URL"
            echo
            echo "- **was PAUSED — restore requested**: the project had already paused; a restore was triggered automatically. Check the dashboard in a few minutes."
            echo "- **HTTP 401**: the access token is missing, revoked or expired — create a new one and update the \`SUPABASE_ACCESS_TOKEN\` secret."
            echo "- **HTTP 404**: \`SUPABASE_PROJECT_REFS\` contains a ref that does not exist."
            echo "- **is not set**: add the secret / variable described at the top of \`.github/workflows/supabase-keepalive.yml\`."
            echo
            echo "_This issue is updated by every failing run and closes itself on the next successful one._"
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --search "in:title \"$ALERT_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ALERT_TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$ALERT_TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Clear the alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ALERT_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ALERT_TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Recovered: the keep-alive succeeded at $(date -u '+%Y-%m-%d %H:%M UTC')."
          fi
